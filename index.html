<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日本地図選択</title>

<style>
body {
  margin: 0;
  background: #f4f6f9;
  font-family: sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.wrapper {
  width: 90vw;
  aspect-ratio: 16 / 9;
  display: flex;
  background: white;
  box-shadow: 0 10px 30px rgba(0,0,0,0.1);
  overflow: hidden;
}

.left {
  width: 50%;
  position: relative;
  background: #eef3f9;
}

.right {
  width: 50%;
  overflow-y: auto;
  padding: 20px;
  background: #ffffff;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
}

.right button {
  padding: 8px;
  border: 1px solid #ccc;
  background: #f8f8f8;
  cursor: pointer;
  border-radius: 6px;
  transition: 0.2s;
}

.right button:hover {
  background: #e0e0e0;
}

.right button.active {
  background: red;
  color: white;
  border-color: red;
}

svg {
  width: 100%;
  height: 100%;
}

.prefecture {
  cursor: pointer;
  transition: 0.2s;
}

.prefecture.active path,
.prefecture.active polygon {
  fill: red !important;
}

.label-layer {
  position: absolute;
  top: 0;
  left: 0;
  pointer-events: none;
  width: 100%;
  height: 100%;
}

.pref-label {
  position: absolute;
  background: rgba(255,0,0,0.85);
  color: white;
  padding: 2px 6px;
  font-size: 12px;
  border-radius: 4px;
  transform: translate(-50%, -50%);
}
</style>
</head>

<body>

<div class="wrapper">

  <div class="left">
    <object id="map" type="image/svg+xml" data="map-mobile.svg"></object>
    <div class="label-layer" id="labels"></div>
  </div>

  <div class="right" id="buttonArea"></div>

</div>

<script>

const selected = new Set();

const object = document.getElementById("map");

object.addEventListener("load", function() {

  const svgDoc = object.contentDocument;
  const prefectures = svgDoc.querySelectorAll("g[data-code]");
  const buttonArea = document.getElementById("buttonArea");

  prefectures.forEach(pref => {

    pref.classList.add("prefecture");

    const title = pref.querySelector("title")?.textContent || "";
    const name = title.split("/")[0].trim();
    const key = pref.classList[0];

    // ボタン生成
    const btn = document.createElement("button");
    btn.textContent = name;
    btn.dataset.key = key;
    buttonArea.appendChild(btn);

    btn.addEventListener("click", () => togglePref(pref, btn, name));
    pref.addEventListener("click", () => togglePref(pref, btn, name));

  });
});


function togglePref(pref, btn, name) {

  const key = btn.dataset.key;
  const labels = document.getElementById("labels");

  if (selected.has(key)) {
    selected.delete(key);
    pref.classList.remove("active");
    btn.classList.remove("active");

    const label = document.getElementById("label-" + key);
    if (label) label.remove();

  } else {
    selected.add(key);
    pref.classList.add("active");
    btn.classList.add("active");

    // 中心座標取得
    const bbox = pref.getBBox();
    const svg = pref.ownerSVGElement;

    const pt = svg.createSVGPoint();
    pt.x = bbox.x + bbox.width / 2;
    pt.y = bbox.y + bbox.height / 2;

    const screenCTM = pref.getScreenCTM();
    const transformed = pt.matrixTransform(screenCTM);

    const containerRect = document.querySelector(".left").getBoundingClientRect();

    const label = document.createElement("div");
    label.className = "pref-label";
    label.id = "label-" + key;
    label.textContent = name;

    label.style.left = (transformed.x - containerRect.left) + "px";
    label.style.top = (transformed.y - containerRect.top) + "px";

    labels.appendChild(label);
  }
}

</script>

</body>
</html>

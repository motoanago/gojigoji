<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日本地図</title>
<style>
body{
  margin:0;
  background:#f5f5f5;
  font-family:sans-serif;
  text-align:center;
}
#map-container{
  width:100%;
  height:90vh;
  overflow:hidden;
  touch-action:none;
}
svg{
  width:100%;
  height:100%;
}
.prefecture{
  cursor:pointer;
  fill:white;
  stroke:#333;
}
.prefecture.active{
  fill:red;
}
</style>
</head>
<body>

<div id="map-container"></div>

<script>
const container=document.getElementById("map-container");

let scale=1;
let translateX=0;
let translateY=0;
let startX,startY;
let isDragging=false;
let initialDistance=0;
let initialScale=1;

fetch("map-full.svg")
.then(res=>res.text())
.then(data=>{

container.innerHTML=data;
const svg=container.querySelector("svg");

// ===== 地図レイヤー =====
const wrapper=document.createElementNS("http://www.w3.org/2000/svg","g");
while(svg.firstChild){
  wrapper.appendChild(svg.firstChild);
}
svg.appendChild(wrapper);

// ===== ラベルレイヤー =====
const labelLayer=document.createElementNS("http://www.w3.org/2000/svg","g");
svg.appendChild(labelLayer);

// ===== 都道府県取得 =====
const prefs=wrapper.querySelectorAll(".prefecture");

// ===== ラベル生成（transform完全対応）=====
prefs.forEach(pref=>{

  const title=pref.querySelector("title");
  if(!title) return;

  const name=title.textContent.split("/")[0].trim();

  const bbox=pref.getBBox();
  const matrix=pref.getCTM();

  const point=svg.createSVGPoint();
  point.x=bbox.x+bbox.width/2;
  point.y=bbox.y+bbox.height/2;

  const globalPoint=point.matrixTransform(matrix);

  const text=document.createElementNS("http://www.w3.org/2000/svg","text");
  text.setAttribute("x",globalPoint.x);
  text.setAttribute("y",globalPoint.y);
  text.setAttribute("text-anchor","middle");
  text.setAttribute("dominant-baseline","middle");

  // 初期フォントサイズ（県サイズに合わせる）
  let baseFont=bbox.width/name.length*0.6;
  baseFont=Math.max(8,Math.min(baseFont,18));

  text.setAttribute("data-base-font",baseFont);
  text.setAttribute("font-size",baseFont);

  text.setAttribute("fill","#000");
  text.setAttribute("stroke","#fff");
  text.setAttribute("stroke-width","3");
  text.setAttribute("paint-order","stroke");
  text.setAttribute("pointer-events","none");
  text.textContent=name;

  labelLayer.appendChild(text);

  pref.addEventListener("click",()=>{
    pref.classList.toggle("active");
  });

});

updateTransform();

// ========================
// タッチ操作
// ========================
container.addEventListener("touchstart",e=>{
  if(e.touches.length===2){
    initialDistance=getDistance(e.touches);
    initialScale=scale;
  }else if(e.touches.length===1){
    isDragging=true;
    startX=e.touches[0].clientX-translateX;
    startY=e.touches[0].clientY-translateY;
  }
});

container.addEventListener("touchmove",e=>{

  if(e.touches.length===2){
    e.preventDefault();

    const newDistance=getDistance(e.touches);
    let newScale=initialScale*(newDistance/initialDistance);
    newScale=Math.max(0.5,Math.min(newScale,5));

    const rect=container.getBoundingClientRect();
    const centerX=(e.touches[0].clientX+e.touches[1].clientX)/2-rect.left;
    const centerY=(e.touches[0].clientY+e.touches[1].clientY)/2-rect.top;

    translateX=centerX-(centerX-translateX)*(newScale/scale);
    translateY=centerY-(centerY-translateY)*(newScale/scale);

    scale=newScale;
    updateTransform();
  }

  else if(e.touches.length===1 && isDragging){
    translateX=e.touches[0].clientX-startX;
    translateY=e.touches[0].clientY-startY;
    updateTransform();
  }

});

container.addEventListener("touchend",()=>{
  isDragging=false;
});

// ========================
// マウス操作
// ========================
container.addEventListener("mousedown",e=>{
  isDragging=true;
  startX=e.clientX-translateX;
  startY=e.clientY-translateY;
});
container.addEventListener("mousemove",e=>{
  if(!isDragging)return;
  translateX=e.clientX-startX;
  translateY=e.clientY-startY;
  updateTransform();
});
container.addEventListener("mouseup",()=>isDragging=false);
container.addEventListener("mouseleave",()=>isDragging=false);

// ========================
// 変形処理
// ========================
function updateTransform(){

  const transform=`translate(${translateX},${translateY}) scale(${scale})`;
  wrapper.setAttribute("transform",transform);
  labelLayer.setAttribute("transform",transform);

  // 文字サイズをスケールに連動
  labelLayer.querySelectorAll("text").forEach(t=>{
    const baseFont=parseFloat(t.getAttribute("data-base-font"));
    t.setAttribute("font-size",baseFont);
  });

}

function getDistance(touches){
  const dx=touches[0].clientX-touches[1].clientX;
  const dy=touches[0].clientY-touches[1].clientY;
  return Math.sqrt(dx*dx+dy*dy);
}

});
</script>
</body>
</html>

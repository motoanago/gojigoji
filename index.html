<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Japan Map</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
body {
  margin: 0;
  overflow: hidden;
}

svg {
  width: 100vw;
  height: 100vh;
  touch-action: none;
}

.prefecture {
  fill: white;
  stroke: #333;
  stroke-width: 0.5;
  cursor: pointer;
}

.prefecture.selected {
  fill: red;
}

.label {
  font-size: 10px;
  text-anchor: middle;
  pointer-events: none;
  fill: black;
}
</style>
</head>
<body>

<svg id="map"></svg>

<script>

const width = window.innerWidth;
const height = window.innerHeight;

const svg = d3.select("#map");
const g = svg.append("g");
const labelLayer = svg.append("g"); // 文字は別レイヤー（拡大縮小しない）

const projection = d3.geoMercator()
  .center([137, 38])
  .scale(1800)
  .translate([width / 2, height / 2]);

const path = d3.geoPath().projection(projection);

d3.json("https://raw.githubusercontent.com/dataofjapan/land/master/japan.geojson")
.then(function(data) {

  // ---- 都道府県描画 ----
  const prefectures = g.selectAll("path")
    .data(data.features)
    .enter()
    .append("path")
    .attr("class", "prefecture")
    .attr("d", path)
    .on("click", function() {
      d3.select(this).classed("selected",
        !d3.select(this).classed("selected"));
    });

  // ---- ラベル（常に表示）----
  const labels = labelLayer.selectAll("text")
    .data(data.features)
    .enter()
    .append("text")
    .attr("class", "label")
    .attr("x", d => path.centroid(d)[0])
    .attr("y", d => path.centroid(d)[1])
    .text(d => d.properties.name_ja || d.properties.name);

  // ---- 全体の範囲取得 ----
  const bounds = g.node().getBBox();

  const mapWidth = bounds.width;
  const mapHeight = bounds.height;

  // ---- 最小スケール計算（左右と上が画面を超えない）----
  const scaleX = width / mapWidth;
  const scaleY = height / mapHeight;

  const minScale = Math.min(scaleX, scaleY);

  // ---- 初期中央位置調整 ----
  const initialX = (width - mapWidth * minScale) / 2 - bounds.x * minScale;
  const initialY = (height - mapHeight * minScale) / 2 - bounds.y * minScale;

  const zoom = d3.zoom()
    .scaleExtent([minScale, 8]) // 最小以下に縮小不可
    .translateExtent([
      [bounds.x * minScale, bounds.y * minScale],
      [(bounds.x + mapWidth) * minScale,
       (bounds.y + mapHeight) * minScale]
    ])
    .on("zoom", (event) => {

      g.attr("transform", event.transform);

      // ---- ラベルは縮尺に合わせて再配置（サイズ固定）----
      labelLayer.selectAll("text")
        .attr("x", d => {
          const [x, y] = path.centroid(d);
          return event.transform.applyX(x);
        })
        .attr("y", d => {
          const [x, y] = path.centroid(d);
          return event.transform.applyY(y);
        });

    });

  svg.call(zoom);

  // ---- 初期表示 ----
  svg.call(
    zoom.transform,
    d3.zoomIdentity
      .translate(initialX, initialY)
      .scale(minScale)
  );

});

</script>

</body>
</html>

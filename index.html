<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>都道府県マップ</title>

<style>
body{
  margin:0;
  font-family:sans-serif;
  text-align:center;
  background:#f5f5f5;
}

#map-container{
  width:100%;
  height:80vh;
  overflow:hidden;
  touch-action:none;
}

svg{
  width:100%;
  height:100%;
}

.prefecture{
  fill:white;
  stroke:#333;
  stroke-width:1;
}

.prefecture.active{
  fill:red;
}

text{
  pointer-events:none;
  fill:#000;
  stroke:#fff;
  stroke-width:3;
  paint-order:stroke;
  font-size:14px;
}
</style>
</head>

<body>

<h1>あいかのにほんせいは</h1>
<div id="map-container"></div>

<script>
const container = document.getElementById("map-container");

let scale = 1;
let translateX = 0;
let translateY = 0;

let isDragging = false;
let isPinching = false;
let moved = false;

let startX = 0;
let startY = 0;

let initialScale = 1;
let initialDistance = 0;

let g, svg;

fetch("map-full.svg")
.then(res=>res.text())
.then(data=>{

  container.innerHTML = data;
  svg = container.querySelector("svg");

  if(!svg.hasAttribute("viewBox")){
    const w = svg.getAttribute("width");
    const h = svg.getAttribute("height");
    svg.setAttribute("viewBox",`0 0 ${w} ${h}`);
  }

  g = document.createElementNS("http://www.w3.org/2000/svg","g");
  while(svg.firstChild){
    g.appendChild(svg.firstChild);
  }
  svg.appendChild(g);

  // ===== 県名追加 =====
  const prefs = g.querySelectorAll(".prefecture");

  prefs.forEach(pref=>{

    const title = pref.querySelector("title");
    if(!title) return;

    const name = title.textContent.split("/")[0].trim();
    const bbox = pref.getBBox();

    const text = document.createElementNS("http://www.w3.org/2000/svg","text");
    text.setAttribute("x", bbox.x + bbox.width/2);
    text.setAttribute("y", bbox.y + bbox.height/2);
    text.setAttribute("text-anchor","middle");
    text.setAttribute("dominant-baseline","middle");
    text.textContent = name;

    pref.appendChild(text);

    // ===== タップで赤（複数可）=====
    pref.addEventListener("click",()=>{
      pref.classList.toggle("active");
    });
  });

  updateTransform();

  // ===== タッチ開始 =====
  container.addEventListener("touchstart", e=>{

    moved = false;

    if(e.touches.length===2){
      isPinching = true;
      initialDistance = getDistance(e.touches);
      initialScale = scale;
    }

    if(e.touches.length===1){
      isDragging = true;
      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;
    }
  });

  // ===== タッチ移動 =====
  container.addEventListener("touchmove", e=>{

    if(e.touches.length===2){

      e.preventDefault();
      moved = true;

      const newDistance = getDistance(e.touches);
      let newScale = initialScale * (newDistance / initialDistance);

      newScale = Math.max(1, Math.min(newScale,4));

      const pt = svg.createSVGPoint();
      pt.x = (e.touches[0].clientX + e.touches[1].clientX)/2;
      pt.y = (e.touches[0].clientY + e.touches[1].clientY)/2;

      const svgPoint = pt.matrixTransform(svg.getScreenCTM().inverse());

      translateX = svgPoint.x - (svgPoint.x - translateX)*(newScale/scale);
      translateY = svgPoint.y - (svgPoint.y - translateY)*(newScale/scale);

      scale = newScale;
      updateTransform();
    }

    else if(e.touches.length===1 && isDragging){

      const dx = e.touches[0].clientX - startX;
      const dy = e.touches[0].clientY - startY;

      if(Math.abs(dx)>3 || Math.abs(dy)>3){
        moved = true;
      }

      translateX += dx;
      translateY += dy;

      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;

      updateTransform();
    }

  });

  container.addEventListener("touchend",()=>{
    isDragging = false;
    isPinching = false;
  });

});

function updateTransform(){

  const viewBox = svg.viewBox.baseVal;

  const contentWidth  = viewBox.width * scale;
  const contentHeight = viewBox.height * scale;

  const containerRect = container.getBoundingClientRect();
  const containerW = containerRect.width;
  const containerH = containerRect.height;

  if(scale === 1){
    translateX = 0;
    translateY = 0;
  }
  else{
    const minX = containerW - contentWidth;
    const minY = containerH - contentHeight;

    translateX = Math.min(0, Math.max(minX, translateX));
    translateY = Math.min(0, Math.max(minY, translateY));
  }

  g.setAttribute(
    "transform",
    `translate(${translateX},${translateY}) scale(${scale})`
  );
}

function getDistance(touches){
  const dx = touches[0].clientX - touches[1].clientX;
  const dy = touches[0].clientY - touches[1].clientY;
  return Math.sqrt(dx*dx+dy*dy);
}
</script>

</body>
</html>

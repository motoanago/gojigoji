<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>都道府県マップ</title>

<style>
body{
  margin:0;
  font-family:sans-serif;
  text-align:center;
  background:#f5f5f5;
}

h1{ margin:10px 0; }

#map-container{
  width:100%;
  height:80vh;
  overflow:hidden;
  touch-action:none;
  position:relative;
}

svg{
  width:100%;
  height:100%;
}

.prefecture{
  fill:white;
  stroke:#333;
  stroke-width:1;
  cursor:pointer;
}

.prefecture.active{
  fill:red;
}

button{
  margin:10px;
  padding:10px 20px;
  font-size:16px;
}
</style>
</head>

<body>

<h1>あいかのにほんせいは</h1>
<div id="map-container"></div>
<button id="resetBtn">全て解除</button>

<script>
const container = document.getElementById("map-container");

function getSVGFile(){
  return window.innerWidth <= 768
    ? "map-mobile.svg"
    : "map-full.svg";
}

let scale = 1;
let translateX = 0;
let translateY = 0;
let isDragging = false;
let isPinching = false;
let startX = 0;
let startY = 0;
let initialScale = 1;
let initialDistance = 0;
let g, svg;

function loadMap(){

fetch(getSVGFile())
.then(res=>res.text())
.then(data=>{

  container.innerHTML = data;
  svg = container.querySelector("svg");

  // viewBoxが無い場合は追加（ズレ防止）
  if(!svg.hasAttribute("viewBox")){
    const w = svg.getAttribute("width");
    const h = svg.getAttribute("height");
    svg.setAttribute("viewBox",`0 0 ${w} ${h}`);
  }

  g = document.createElementNS("http://www.w3.org/2000/svg","g");
  while(svg.firstChild){
    g.appendChild(svg.firstChild);
  }
  svg.appendChild(g);

  const prefs = g.querySelectorAll(".prefecture");

  // ===== 都道府県名追加（常時表示）=====
  prefs.forEach(pref=>{
    const title = pref.querySelector("title");
    if(!title) return;

    const name = title.textContent.split("/")[0].trim();
    const bbox = pref.getBBox();

    const text = document.createElementNS("http://www.w3.org/2000/svg","text");
    text.setAttribute("x", bbox.x + bbox.width/2);
    text.setAttribute("y", bbox.y + bbox.height/2);
    text.setAttribute("text-anchor","middle");
    text.setAttribute("dominant-baseline","middle");
    text.setAttribute("fill","#000");
    text.setAttribute("stroke","#fff");
    text.setAttribute("stroke-width","3");
    text.setAttribute("paint-order","stroke");
    text.setAttribute("pointer-events","none");
    text.textContent = name;

    pref.appendChild(text);
  });

  // タップで色変更
  prefs.forEach(pref=>{
    pref.addEventListener("click",()=>{
      if(isDragging || isPinching) return;
      pref.classList.toggle("active");
    });
  });

  updateTransform();

  // ===== タッチ開始 =====
  container.addEventListener("touchstart", e=>{

    if(e.touches.length===2){
      isPinching = true;
      initialDistance = getDistance(e.touches);
      initialScale = scale;
    }

    if(e.touches.length===1){
      isDragging = true;
      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;
    }
  });

  // ===== タッチ移動 =====
  container.addEventListener("touchmove", e=>{

    // ----- ピンチ -----
    if(e.touches.length===2){

      e.preventDefault();

      const newDistance = getDistance(e.touches);
      let newScale = initialScale * (newDistance / initialDistance);

      // 0.5〜1 の範囲に制限
      newScale = Math.max(0.5, Math.min(newScale,1));

      const pt = svg.createSVGPoint();
      pt.x = (e.touches[0].clientX + e.touches[1].clientX)/2;
      pt.y = (e.touches[0].clientY + e.touches[1].clientY)/2;

      const svgPoint = pt.matrixTransform(svg.getScreenCTM().inverse());

      translateX = svgPoint.x - (svgPoint.x - translateX)*(newScale/scale);
      translateY = svgPoint.y - (svgPoint.y - translateY)*(newScale/scale);

      scale = newScale;
      updateTransform();
    }

    // ----- ドラッグ -----
    else if(e.touches.length===1 && isDragging){

      const dx = e.touches[0].clientX - startX;
      const dy = e.touches[0].clientY - startY;

      // ★ スケール補正なし（自然な速度）
      translateX += dx;
      translateY += dy;

      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;

      updateTransform();
    }

  });

  container.addEventListener("touchend", ()=>{
    isDragging = false;
    isPinching = false;
  });

  // ===== マウス =====
  container.addEventListener("mousedown", e=>{
    isDragging = true;
    startX = e.clientX;
    startY = e.clientY;
  });

  container.addEventListener("mousemove", e=>{
    if(!isDragging) return;

    const dx = e.clientX - startX;
    const dy = e.clientY - startY;

    translateX += dx;
    translateY += dy;

    startX = e.clientX;
    startY = e.clientY;

    updateTransform();
  });

  container.addEventListener("mouseup", ()=>{isDragging=false;});
  container.addEventListener("mouseleave", ()=>{isDragging=false;});

});

}

function updateTransform(){

  const rect = container.getBoundingClientRect();
  const svgWidth  = rect.width;
  const svgHeight = rect.height;

  const contentWidth  = svgWidth  * scale;
  const contentHeight = svgHeight * scale;

  // ★ 最大表示（scale=1）のときだけ固定
  if(scale === 1){

    const minX = svgWidth - contentWidth;
    const maxX = 0;
    translateX = Math.min(maxX, Math.max(minX, translateX));

    const minY = svgHeight - contentHeight;
    const maxY = 0;
    translateY = Math.min(maxY, Math.max(minY, translateY));
  }

  g.setAttribute(
    "transform",
    `translate(${translateX},${translateY}) scale(${scale})`
  );

  // 文字サイズ連動
  const texts = g.querySelectorAll("text");
  texts.forEach(t=>{
    t.setAttribute("font-size", 14/scale);
  });
}

function getDistance(touches){
  const dx = touches[0].clientX - touches[1].clientX;
  const dy = touches[0].clientY - touches[1].clientY;
  return Math.sqrt(dx*dx+dy*dy);
}

loadMap();

window.addEventListener("resize",()=>{
  container.innerHTML="";
  scale=1;
  translateX=0;
  translateY=0;
  loadMap();
});

document.getElementById("resetBtn").addEventListener("click",()=>{
  document.querySelectorAll(".prefecture").forEach(p=>{
    p.classList.remove("active");
  });
});
</script>

</body>
</html>

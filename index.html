<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>日本地図</title>

<style>
body{
  margin:0;
  background:#f5f5f5;
  font-family:sans-serif;
}

#map-container{
  width:100%;
  height:100vh;
}

svg{
  width:100%;
  height:100%;
}

.prefecture text{
  font-size:14px;
  fill:#222;
  font-weight:bold;
  pointer-events:none;
}

.prefecture{
  cursor:pointer;
  transition:fill 0.2s;
}

.prefecture:hover{
  fill:#cce5ff;
}

.prefecture.active{
  fill:#66b3ff !important;
}
</style>
</head>

<body>

<div id="map-container"></div>

<script>
fetch("map-mobile.svg")
.then(res => res.text())
.then(data => {

  document.getElementById("map-container").innerHTML = data;

  const svg = document.querySelector("svg");
  const prefs = svg.querySelectorAll(".prefecture");

  prefs.forEach(pref => {

    const title = pref.querySelector("title");
    if(!title) return;

    const name = title.textContent.split("/")[0].trim();

    let targetElement = pref;

    // ===== 東京と鹿児島だけ特別処理 =====
    if(name === "東京" || name === "鹿児島"){

      const paths = pref.querySelectorAll("path, polygon");

      let largest = null;
      let maxArea = 0;

      paths.forEach(p=>{
        const b = p.getBBox();
        const area = b.width * b.height;
        if(area > maxArea){
          maxArea = area;
          largest = p;
        }
      });

      if(largest){
        targetElement = largest;
      }
    }

    const bbox = targetElement.getBBox();

    const x = bbox.x + bbox.width / 2;
    const y = bbox.y + bbox.height / 2;

    const text = document.createElementNS("http://www.w3.org/2000/svg","text");
    text.setAttribute("x", x);
    text.setAttribute("y", y);
    text.setAttribute("text-anchor","middle");
    text.setAttribute("dominant-baseline","middle");

    text.textContent = name
      .replace("県","")
      .replace("府","")
      .replace("都","");

    pref.appendChild(text);

    pref.addEventListener("click", ()=>{
      pref.classList.toggle("active");
    });

  });

});
</script>

</body>
</html>

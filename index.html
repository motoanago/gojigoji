<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>都道府県マップ</title>

<style>
body{
  margin:0;
  font-family:sans-serif;
  text-align:center;
  background:#f5f5f5;
}
h1{ margin:10px 0; }

#map-container{
  width:100%;
  height:80vh;
  overflow:hidden;
  touch-action:none;
  position:relative;
}

svg{ width:100%; height:100%; }

.prefecture{
  fill:white;
  stroke:#333;
  stroke-width:1;
  cursor:pointer;
}

.prefecture.active{ fill:red; }

button{
  margin:10px;
  padding:10px 20px;
  font-size:16px;
}
</style>
</head>

<body>

<h1>あいかのにほんせいは</h1>
<div id="map-container"></div>
<button id="resetBtn">全て解除</button>

<script>
const container = document.getElementById("map-container");

function getSVGFile(){
  return window.innerWidth <= 768
    ? "map-mobile.svg"
    : "map-full.svg";
}

let scale = 1;
let translateX = 0;
let translateY = 0;
let isPinching = false;
let isDragging = false;
let startPoint = null;

function loadMap(){

  fetch(getSVGFile())
  .then(res=>res.text())
  .then(data=>{

    container.innerHTML = data;
    const svg = container.querySelector("svg");

    // viewBoxが無いSVG対策
    if(!svg.hasAttribute("viewBox")){
      const w = svg.getAttribute("width");
      const h = svg.getAttribute("height");
      svg.setAttribute("viewBox", `0 0 ${w} ${h}`);
    }

    const g = document.createElementNS("http://www.w3.org/2000/svg","g");

    while(svg.firstChild){
      g.appendChild(svg.firstChild);
    }
    svg.appendChild(g);

    const prefs = g.querySelectorAll(".prefecture");

    // ===== 都道府県名追加 =====
    prefs.forEach(pref => {

      const title = pref.querySelector("title");
      if(!title) return;

      const name = title.textContent.split("/")[0].trim();
      const bbox = pref.getBBox();

      const text = document.createElementNS("http://www.w3.org/2000/svg","text");
      text.setAttribute("x", bbox.x + bbox.width/2);
      text.setAttribute("y", bbox.y + bbox.height/2);
      text.setAttribute("text-anchor","middle");
      text.setAttribute("dominant-baseline","middle");
      text.setAttribute("font-size","14");
      text.setAttribute("fill","#000");
      text.setAttribute("stroke","#fff");
      text.setAttribute("stroke-width","3");
      text.setAttribute("paint-order","stroke");
      text.setAttribute("pointer-events","none");
      text.style.display = "none";
      text.textContent = name;

      pref.appendChild(text);
    });

    prefs.forEach(pref=>{
      pref.addEventListener("click",()=>{
        if(isPinching || isDragging) return;
        pref.classList.toggle("active");
      });
    });

    updateTransform();

    let initialDistance = 0;
    let initialScale = 1;

    function getSVGPoint(clientX, clientY){
      const pt = svg.createSVGPoint();
      pt.x = clientX;
      pt.y = clientY;
      return pt.matrixTransform(svg.getScreenCTM().inverse());
    }

    // ===== タッチ開始 =====
    container.addEventListener("touchstart", e=>{

      if(e.touches.length===2){
        isPinching = true;
        initialDistance = getDistance(e.touches);
        initialScale = scale;
      }
      else if(e.touches.length===1){
        isDragging = true;
        startPoint = getSVGPoint(
          e.touches[0].clientX,
          e.touches[0].clientY
        );
      }
    });

    // ===== タッチ移動 =====
    container.addEventListener("touchmove", e=>{

      if(e.touches.length===2){
        e.preventDefault();

        const newDistance = getDistance(e.touches);
        let newScale = initialScale * (newDistance / initialDistance);
        newScale = Math.max(1, Math.min(newScale,5));

        const centerX = (e.touches[0].clientX + e.touches[1].clientX)/2;
        const centerY = (e.touches[0].clientY + e.touches[1].clientY)/2;

        const svgPoint = getSVGPoint(centerX, centerY);

        translateX = svgPoint.x - (svgPoint.x - translateX)*(newScale/scale);
        translateY = svgPoint.y - (svgPoint.y - translateY)*(newScale/scale);

        scale = newScale;
        updateTransform();
      }

      else if(e.touches.length===1 && isDragging && scale>1){

        const movePoint = getSVGPoint(
          e.touches[0].clientX,
          e.touches[0].clientY
        );

        translateX += movePoint.x - startPoint.x;
        translateY += movePoint.y - startPoint.y;

        startPoint = movePoint;
        updateTransform();
      }

    });

    container.addEventListener("touchend", ()=>{
      isPinching=false;
      isDragging=false;
    });

    // ===== マウス操作 =====
    container.addEventListener("mousedown", e=>{
      if(scale<=1) return;
      isDragging = true;
      startPoint = getSVGPoint(e.clientX, e.clientY);
    });

    container.addEventListener("mousemove", e=>{
      if(!isDragging) return;

      const movePoint = getSVGPoint(e.clientX, e.clientY);

      translateX += movePoint.x - startPoint.x;
      translateY += movePoint.y - startPoint.y;

      startPoint = movePoint;
      updateTransform();
    });

    container.addEventListener("mouseup", ()=>{ isDragging=false; });
    container.addEventListener("mouseleave", ()=>{ isDragging=false; });

    function updateTransform(){
      g.setAttribute(
        "transform",
        `translate(${translateX},${translateY}) scale(${scale})`
      );

      const texts = g.querySelectorAll("text");
      texts.forEach(t=>{
        t.style.display = scale > 2 ? "block" : "none";
      });
    }

    function getDistance(touches){
      const dx = touches[0].clientX - touches[1].clientX;
      const dy = touches[0].clientY - touches[1].clientY;
      return Math.sqrt(dx*dx+dy*dy);
    }

  });
}

loadMap();

window.addEventListener("resize",()=>{
  container.innerHTML="";
  scale=1;
  translateX=0;
  translateY=0;
  loadMap();
});

document.getElementById("resetBtn").addEventListener("click",()=>{
  document.querySelectorAll(".prefecture").forEach(p=>{
    p.classList.remove("active");
  });
});
</script>

</body>
</html>

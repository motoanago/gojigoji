<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日本地図</title>
<style>
body{
  margin:0;
  background:#f5f5f5;
  font-family:sans-serif;
}
#map-container{
  width:100%;
  height:100vh;
  overflow:hidden;
  touch-action:none;
}
svg{
  width:100%;
  height:100%;
}
.prefecture{
  fill:white;
  stroke:#333;
  cursor:pointer;
}
.prefecture.active{
  fill:red;
}
text{
  fill:#000;
  stroke:#fff;
  stroke-width:3;
  paint-order:stroke;
  pointer-events:none;
}
</style>
</head>
<body>

<div id="map-container"></div>

<script>
const container=document.getElementById("map-container");

let scale=1;
let translateX=0;
let translateY=0;
let isDragging=false;
let startPoint=null;
let initialDistance=0;
let initialScale=1;

fetch("map-full.svg")
.then(res=>res.text())
.then(data=>{

container.innerHTML=data;

const svg=container.querySelector("svg");

/* ===============================
   viewBoxが無いSVG対策（超重要）
================================ */
if(!svg.hasAttribute("viewBox")){
  const w=svg.getAttribute("width");
  const h=svg.getAttribute("height");
  svg.setAttribute("viewBox",`0 0 ${w} ${h}`);
}

/* ===============================
   地図ラッパー
================================ */
const wrapper=document.createElementNS("http://www.w3.org/2000/svg","g");
while(svg.firstChild){
  wrapper.appendChild(svg.firstChild);
}
svg.appendChild(wrapper);

/* ===============================
   ラベル生成（transform完全対応）
================================ */
const prefs=wrapper.querySelectorAll(".prefecture");

prefs.forEach(pref=>{

  const title=pref.querySelector("title");
  if(!title) return;

  const name=title.textContent.split("/")[0].trim();

  const bbox=pref.getBBox();
  const matrix=pref.getCTM();

  const pt=svg.createSVGPoint();
  pt.x=bbox.x+bbox.width/2;
  pt.y=bbox.y+bbox.height/2;

  const global=pt.matrixTransform(matrix);

  const text=document.createElementNS("http://www.w3.org/2000/svg","text");
  text.setAttribute("x",global.x);
  text.setAttribute("y",global.y);
  text.setAttribute("text-anchor","middle");
  text.setAttribute("dominant-baseline","middle");

  let baseFont=bbox.width/name.length*0.6;
  baseFont=Math.max(8,Math.min(baseFont,18));
  text.setAttribute("font-size",baseFont);

  text.textContent=name;

  wrapper.appendChild(text);

  pref.addEventListener("click",()=>{
    pref.classList.toggle("active");
  });

});

/* ===============================
   座標変換関数（ズレ防止の核心）
================================ */
function getSVGPoint(clientX,clientY){
  const pt=svg.createSVGPoint();
  pt.x=clientX;
  pt.y=clientY;
  return pt.matrixTransform(svg.getScreenCTM().inverse());
}

/* ===============================
   タッチ開始
================================ */
container.addEventListener("touchstart",e=>{

  if(e.touches.length===2){
    initialDistance=getDistance(e.touches);
    initialScale=scale;
  }
  else if(e.touches.length===1){
    isDragging=true;
    startPoint=getSVGPoint(
      e.touches[0].clientX,
      e.touches[0].clientY
    );
  }

});

/* ===============================
   タッチ移動
================================ */
container.addEventListener("touchmove",e=>{

  if(e.touches.length===2){
    e.preventDefault();

    const newDistance=getDistance(e.touches);
    let newScale=initialScale*(newDistance/initialDistance);
    newScale=Math.max(0.5,Math.min(newScale,5));

    const centerX=(e.touches[0].clientX+e.touches[1].clientX)/2;
    const centerY=(e.touches[0].clientY+e.touches[1].clientY)/2;

    const svgPoint=getSVGPoint(centerX,centerY);

    translateY=svgPoint.y-(svgPoint.y-translateY)*(newScale/scale);

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>日本地図</title>

<style>
body{
  margin:0;
  background:#f5f5f5;
  font-family: "Hiragino Kaku Gothic ProN", 
               "Yu Gothic", 
               "Noto Sans JP", 
               sans-serif;
}

#map-container{
  width:100%;
  height:100vh;
}

svg{
  width:100%;
  height:100%;
}

/* 都道府県 */
.prefecture{
  cursor:pointer;
  transition:fill 0.2s ease;
  fill:#ffffff;
  stroke:#333;
  stroke-width:1;
}

/* hoverはactiveでない時のみ */
.prefecture:hover:not(.active){
  fill:#dceeff;
}

/* 選択状態 */
.prefecture.active{
  fill:#66aaff !important;
}

/* 県名テキスト */
.prefecture text{
  font-size:13px;
  fill:#111;
  font-weight:300;   /* ← 太さを軽めに */
  pointer-events:none;
}
</style>
</head>

<body>

<div id="map-container"></div>

<script>
fetch("map-mobile.svg")
.then(res => res.text())
.then(data => {

  document.getElementById("map-container").innerHTML = data;

  const svg = document.querySelector("svg");
  const prefs = svg.querySelectorAll(".prefecture");

  prefs.forEach(pref => {

    const title = pref.querySelector("title");
    if(!title) return;

    const name = title.textContent.split("/")[0].trim();

    let targetElement = pref;

    // ===== 鹿児島は最大面積パス（本土）を使用 =====
    if(name === "鹿児島"){

      const paths = pref.querySelectorAll("path, polygon");

      let largest = null;
      let maxArea = 0;

      paths.forEach(p=>{
        const b = p.getBBox();
        const area = b.width * b.height;
        if(area > maxArea){
          maxArea = area;
          largest = p;
        }
      });

      if(largest){
        targetElement = largest;
      }
    }

    const bbox = targetElement.getBBox();

    let x = bbox.x + bbox.width / 2;
    let y = bbox.y + bbox.height / 2;

    // ===== 東京だけ微調整（離島補正） =====
    if(name === "東京"){
      x = bbox.x + bbox.width * 0.56;
      y = bbox.y + bbox.height * 0.34;
    }

    const text = document.createElementNS("http://www.w3.org/2000/svg","text");
    text.setAttribute("x", x);
    text.setAttribute("y", y);
    text.setAttribute("text-anchor","middle");
    text.setAttribute("dominant-baseline","middle");

    text.textContent = name
      .replace("県","")
      .replace("府","")
      .replace("都","");

    pref.appendChild(text);

    // クリックで選択切替
    pref.addEventListener("click", ()=>{
      pref.classList.toggle("active");
    });

  });

});
</script>

</body>
</html>

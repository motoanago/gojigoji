<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>日本地図</title>

<style>
body{
  margin:0;
  background:#f5f5f5;
  font-family:
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    "Noto Sans JP",
    sans-serif;
}

#map-container{
  width:100%;
  height:100vh;
}

svg{
  width:100%;
  height:100%;
}

/* 都道府県 */
.prefecture{
  cursor:pointer;
  stroke:#333;
  stroke-width:1;
}

/* テキスト */
.prefecture text{
  font-size:13px;
  fill:#111;
  font-weight:300;
  pointer-events:none;
}
</style>
</head>

<body>

<div id="map-container"></div>

<script>
fetch("map-mobile.svg")
.then(res => res.text())
.then(data => {

  document.getElementById("map-container").innerHTML = data;

  const svg = document.querySelector("svg");
  const prefs = svg.querySelectorAll(".prefecture");

  prefs.forEach(pref => {

    const title = pref.querySelector("title");
    if(!title) return;

    const name = title.textContent.split("/")[0].trim();

    // ===== 初期色を強制リセット =====
    pref.querySelectorAll("path, polygon").forEach(el=>{
      el.style.fill = "#ffffff";
    });

    let targetElement = pref;

    // ===== 鹿児島は最大面積 =====
    if(name === "鹿児島"){
      const paths = pref.querySelectorAll("path, polygon");

      let largest = null;
      let maxArea = 0;

      paths.forEach(p=>{
        const b = p.getBBox();
        const area = b.width * b.height;
        if(area > maxArea){
          maxArea = area;
          largest = p;
        }
      });

      if(largest) targetElement = largest;
    }

    const bbox = targetElement.getBBox();
    let x = bbox.x + bbox.width / 2;
    let y = bbox.y + bbox.height / 2;

    // ===== 東京は本土だけ取得 =====
    if(name === "東京"){
      const paths = pref.querySelectorAll("path");
      let mainland = null;
      let maxArea = 0;

      paths.forEach(p=>{
        const b = p.getBBox();
        const area = b.width * b.height;
        if(area > maxArea){
          maxArea = area;
          mainland = p;
        }
      });

      if(mainland){
        const b = mainland.getBBox();
        x = b.x + b.width / 2;
        y = b.y + b.height / 2;
      }
    }

    const text = document.createElementNS("http://www.w3.org/2000/svg","text");
    text.setAttribute("x", x);
    text.setAttribute("y", y);
    text.setAttribute("text-anchor","middle");
    text.setAttribute("dominant-baseline","middle");

    text.textContent = name
      .replace("県","")
      .replace("府","")
      .replace("都","");

    pref.appendChild(text);

    // ===== クリック制御（完全色管理）=====
    let selected = false;

    pref.addEventListener("click", ()=>{

      selected = !selected;

      pref.querySelectorAll("path, polygon").forEach(el=>{
        el.style.fill = selected ? "#66aaff" : "#ffffff";
      });

    });

    // ===== hover制御 =====
    pref.addEventListener("mouseenter", ()=>{
      if(!selected){
        pref.querySelectorAll("path, polygon").forEach(el=>{
          el.style.fill = "#dceeff";
        });
      }
    });

    pref.addEventListener("mouseleave", ()=>{
      if(!selected){
        pref.querySelectorAll("path, polygon").forEach(el=>{
          el.style.fill = "#ffffff";
        });
      }
    });

  });

});
</script>

</body>
</html>

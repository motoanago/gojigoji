<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>日本地図クリック</title>

<style>
body {
  margin: 0;
  background: #f4f4f4;
  font-family: sans-serif;
}

.map-container {
  width: 90%;
  margin: 40px auto;
}

/* SVGをレスポンシブに */
svg {
  width: 100%;
  height: auto;
}

/* 都道府県 */
.pref {
  fill: #e0e0e0;
  stroke: #333;
  stroke-width: 1;
  cursor: pointer;
  transition: 0.2s;
}

.pref:hover {
  fill: #ff9999;
}

/* クリック後 */
.pref.active {
  fill: red;
}

/* ラベル */
.pref-label {
  font-size: 18px;
  font-weight: bold;
  text-anchor: middle;
  pointer-events: none;
}
</style>
</head>

<body>

<div class="map-container">

<svg viewBox="0 0 1000 700">

  <!-- 北海道 -->
  <path id="hokkaido" class="pref"
    d="M600 80 L700 80 L720 150 L650 180 L580 140 Z" />
  <text x="650" y="130" class="pref-label">北海道</text>

  <!-- 東京 -->
  <path id="tokyo" class="pref"
    d="M620 400 L660 400 L660 440 L620 440 Z" />
  <text x="640" y="425" class="pref-label">東京</text>

  <!-- 大阪 -->
  <path id="osaka" class="pref"
    d="M500 450 L540 450 L540 490 L500 490 Z" />
  <text x="520" y="475" class="pref-label">大阪</text>

  <!-- 福岡 -->
  <path id="fukuoka" class="pref"
    d="M350 480 L390 480 L390 520 L350 520 Z" />
  <text x="370" y="505" class="pref-label">福岡</text>

</svg>

</div>

<script>

// クリックで赤くする
document.querySelectorAll('.pref').forEach(pref => {
  pref.addEventListener('click', function () {
    this.classList.toggle('active');
  });
});

// 最初から東京を赤にする例
document.getElementById('tokyo').classList.add('active');

</script>

</body>
</html>

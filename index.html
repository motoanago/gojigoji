<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Japan SVG Map</title>
<script src="https://d3js.org/d3.v7.min.js"></script>

<style>
body{
  margin:0;
  overflow:hidden;
}

svg{
  width:100vw;
  height:100vh;
  touch-action:none;
  background:white;
}

.prefecture{
  fill:#eeeeee;
  stroke:#333;
  stroke-width:1;
  cursor:pointer;
  transition:0.2s;
}

.prefecture:hover{
  fill:#ddd;
}

.prefecture.selected{
  fill:red;
}

.label{
  font-size:12px;
  font-weight:bold;
  text-anchor:middle;
  pointer-events:none;
  fill:black;
}
</style>
</head>

<body>

<svg id="map" viewBox="0 0 1200 900">

<!-- ========================= -->
<!-- ★ あなたの <g>群 をここに貼る ★ -->
<!-- ========================= -->

</svg>

<script>

const svg = d3.select("#map");

// レイヤー
const mapLayer = svg.append("g");
const labelLayer = svg.append("g");

// 既存のgを全部mapLayerへ移動
const originalGroups = svg.selectAll(":scope > g");
mapLayer.node().append(...originalGroups.nodes());

// クリックで赤
mapLayer.selectAll("g")
  .classed("prefecture", true)
  .on("click", function(){
    d3.select(this)
      .classed("selected",
        !d3.select(this).classed("selected"));
  });

// ===== ラベル生成 =====
mapLayer.selectAll("g").each(function(){

  const group = d3.select(this);
  const title = group.select("title").text();

  if(!title) return;

  const name = title.split(" / ")[0];

  const bbox = this.getBBox();
  const cx = bbox.x + bbox.width/2;
  const cy = bbox.y + bbox.height/2;

  labelLayer.append("text")
    .attr("class","label")
    .attr("data-x",cx)
    .attr("data-y",cy)
    .attr("x",cx)
    .attr("y",cy)
    .text(name);
});

// ===== ズーム制御 =====
const bounds = mapLayer.node().getBBox();

const width = window.innerWidth;
const height = window.innerHeight;

const mapWidth = bounds.width;
const mapHeight = bounds.height;

const minScale = Math.min(
  width/mapWidth,
  height/mapHeight
);

const initialX =
  (width - mapWidth*minScale)/2
  - bounds.x*minScale;

const initialY =
  (height - mapHeight*minScale)/2
  - bounds.y*minScale;

const zoom = d3.zoom()
  .scaleExtent([minScale,8])
  .on("zoom",(event)=>{

    mapLayer.attr("transform",event.transform);

    labelLayer.selectAll("text")
      .attr("x",function(){
        return event.transform.applyX(
          +d3.select(this).attr("data-x")
        );
      })
      .attr("y",function(){
        return event.transform.applyY(
          +d3.select(this).attr("data-y")
        );
      });

  });

svg.call(zoom);

svg.call(
  zoom.transform,
  d3.zoomIdentity
    .translate(initialX,initialY)
    .scale(minScale)
);

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>日本地図</title>

<style>
body{
  margin:0;
  background:#f5f5f5;
  font-family:sans-serif;
}

svg{
  width:100%;
  height:100vh;
}

.prefecture text{
  font-size:14px;
  pointer-events:none;
  fill:#222;
  font-weight:bold;
}

.prefecture{
  cursor:pointer;
  transition:fill 0.2s;
}

.prefecture:hover{
  fill:#cce5ff;
}

.prefecture.active{
  fill:#66b3ff !important;
}
</style>
</head>

<body>

<!-- あなたのSVGをここに貼る -->
<!-- 例： -->
<object id="svgObject" type="image/svg+xml" data="map-full.svg"></object>

<script>
document.getElementById("svgObject").addEventListener("load", function(){

  const svgDoc = this.contentDocument;
  const prefs = svgDoc.querySelectorAll(".prefecture");

  prefs.forEach(pref => {

    const title = pref.querySelector("title");
    if(!title) return;

    const name = title.textContent.split("/")[0].trim();

    // ===== transform込みの実サイズ取得 =====
    const rect = pref.getBoundingClientRect();

    // SVG内部座標に変換する
    const svg = svgDoc.querySelector("svg");
    const pt = svg.createSVGPoint();
    pt.x = rect.left + rect.width/2;
    pt.y = rect.top + rect.height/2;

    const svgP = pt.matrixTransform(svg.getScreenCTM().inverse());

    const text = svgDoc.createElementNS("http://www.w3.org/2000/svg","text");
    text.setAttribute("x", svgP.x);
    text.setAttribute("y", svgP.y);
    text.setAttribute("text-anchor","middle");
    text.setAttribute("dominant-baseline","middle");
    text.textContent = name
        .replace("県","")
        .replace("府","")
        .replace("都","");

    pref.appendChild(text);

    // クリックで色変更
    pref.addEventListener("click", ()=>{
      pref.classList.toggle("active");
    });

  });

});
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>都道府県マップ</title>

<style>
body{
  margin:0;
  font-family:sans-serif;
  text-align:center;
  background:#f5f5f5;
}

h1{ margin:10px 0; }

#map-container{
  width:100%;
  height:80vh;
  overflow:hidden;
  touch-action:none;
  position:relative;
}

svg{
  width:100%;
  height:100%;
}

.prefecture{
  fill:white;
  stroke:#333;
  stroke-width:1;
  cursor:pointer;
}

.prefecture.active{
  fill:red;
}

button{
  margin:10px;
  padding:10px 20px;
  font-size:16px;
}
</style>
</head>

<body>

<h1>あいかのにほんせいはあ</h1>
<div id="map-container"></div>
<button id="resetBtn">全て解除</button>

<script>
const container = document.getElementById("map-container");

let scale = 1;          // ★ 1が最小
let translateX = 0;
let translateY = 0;

let isDragging = false;
let isPinching = false;

let startX = 0;
let startY = 0;

let initialScale = 1;
let initialDistance = 0;

let g, svg;

fetch("map-full.svg")
.then(res=>res.text())
.then(data=>{

  container.innerHTML = data;
  svg = container.querySelector("svg");

  if(!svg.hasAttribute("viewBox")){
    const w = svg.getAttribute("width");
    const h = svg.getAttribute("height");
    svg.setAttribute("viewBox",`0 0 ${w} ${h}`);
  }

  g = document.createElementNS("http://www.w3.org/2000/svg","g");
  while(svg.firstChild){
    g.appendChild(svg.firstChild);
  }
  svg.appendChild(g);

  updateTransform();

  // ===== タッチ開始 =====
  container.addEventListener("touchstart", e=>{

    if(e.touches.length===2){
      isPinching = true;
      initialDistance = getDistance(e.touches);
      initialScale = scale;
    }

    if(e.touches.length===1){
      isDragging = true;
      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;
    }
  });

  // ===== タッチ移動 =====
  container.addEventListener("touchmove", e=>{

    // ----- ピンチ拡大 -----
    if(e.touches.length===2){

      e.preventDefault();

      const newDistance = getDistance(e.touches);
      let newScale = initialScale * (newDistance / initialDistance);

      // ★ 1以下にはしない（縮小禁止）
      newScale = Math.max(1, Math.min(newScale,4)); // 最大4倍

      const pt = svg.createSVGPoint();
      pt.x = (e.touches[0].clientX + e.touches[1].clientX)/2;
      pt.y = (e.touches[0].clientY + e.touches[1].clientY)/2;

      const svgPoint = pt.matrixTransform(svg.getScreenCTM().inverse());

      translateX = svgPoint.x - (svgPoint.x - translateX)*(newScale/scale);
      translateY = svgPoint.y - (svgPoint.y - translateY)*(newScale/scale);

      scale = newScale;
      updateTransform();
    }

    // ----- ドラッグ -----
    else if(e.touches.length===1 && isDragging){

      const dx = e.touches[0].clientX - startX;
      const dy = e.touches[0].clientY - startY;

      translateX += dx;
      translateY += dy;

      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;

      updateTransform();
    }

  });

  container.addEventListener("touchend", ()=>{
    isDragging = false;
    isPinching = false;
  });

});

function updateTransform(){

  const rect = container.getBoundingClientRect();
  const w = rect.width;
  const h = rect.height;

  const contentW = w * scale;
  const contentH = h * scale;

  // ★ scale=1（全体表示）のときは中央固定
  if(scale === 1){
    translateX = 0;
    translateY = 0;
  }
  else{
    // ★ 拡大時は画面外に出ないよう制限
    const minX = w - contentW;
    const minY = h - contentH;

    translateX = Math.min(0, Math.max(minX, translateX));
    translateY = Math.min(0, Math.max(minY, translateY));
  }

  g.setAttribute(
    "transform",
    `translate(${translateX},${translateY}) scale(${scale})`
  );
}

function getDistance(touches){
  const dx = touches[0].clientX - touches[1].clientX;
  const dy = touches[0].clientY - touches[1].clientY;
  return Math.sqrt(dx*dx+dy*dy);
}
</script>

</body>
</html>

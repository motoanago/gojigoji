<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Japan Map</title>

<style>
body{
  margin:0;
  background:#f5f7fa;
  font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}

#map-container{
  width:100%;
  max-width:900px;
  margin:auto;
}

svg{
  width:100%;
  height:auto;
}

/* 県のスタイル */
.prefecture path{
  fill:#ffffff;
  stroke:#333;
  stroke-width:1;
  transition: fill .2s ease;
  cursor:pointer;
}

/* 選択中 */
.prefecture.active path{
  fill:#4da3ff !important;
}

/* ラベル */
.pref-label{
  font-size:11px;
  font-weight:500;   /* ← 少し細く */
  fill:#222;
  pointer-events:none;
  text-anchor:middle;
  dominant-baseline:middle;
}
</style>
</head>

<body>

<div id="map-container"></div>

<script>
fetch("map-mobile.svg")
.then(res => res.text())
.then(svgText => {

  document.getElementById("map-container").innerHTML = svgText;
  const svg = document.querySelector("svg");

  const prefectures = svg.querySelectorAll(".prefecture");

  prefectures.forEach(pref => {

    const name = pref.getAttribute("data-name") || "";

    const paths = pref.querySelectorAll("path");
    let x = 0;
    let y = 0;

    /* =========================
       東京だけ特別処理
    ========================== */
    if(name === "東京"){

      let mainlandBox = null;

      paths.forEach(p=>{
        const b = p.getBBox();

        // 東京本土は上部にある（島は下に伸びている）
        if(b.y < 80 && b.width > 20){
          mainlandBox = b;
        }
      });

      if(mainlandBox){
        x = mainlandBox.x + mainlandBox.width / 2;
        y = mainlandBox.y + mainlandBox.height / 2;
      }

    }else{

      // 通常は一番大きい面積のパスを使用
      let largest = null;
      let maxArea = 0;

      paths.forEach(p=>{
        const b = p.getBBox();
        const area = b.width * b.height;
        if(area > maxArea){
          maxArea = area;
          largest = b;
        }
      });

      if(largest){
        x = largest.x + largest.width / 2;
        y = largest.y + largest.height / 2;
      }
    }

    /* =========================
       ラベル生成
    ========================== */
    if(name){
      const text = document.createElementNS("http://www.w3.org/2000/svg","text");
      text.setAttribute("x", x);
      text.setAttribute("y", y);
      text.setAttribute("class","pref-label");
      text.textContent = name;
      svg.appendChild(text);
    }

    /* =========================
       クリック処理（色残り防止）
    ========================== */
    pref.addEventListener("click", function(){

      // 全解除
      prefectures.forEach(p=>{
        p.classList.remove("active");
        const ps = p.querySelectorAll("path");
        ps.forEach(path=>{
          path.style.fill = "";  // ← 完全リセット
        });
      });

      // 選択
      this.classList.add("active");
    });

  });

});
</script>

</body>
</html>

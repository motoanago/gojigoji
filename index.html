<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>都道府県マップ</title>
<style>
body{margin:0;font-family:sans-serif;text-align:center;background:#f5f5f5;}
h1{margin:10px 0;}
#map-container{width:100%;height:80vh;overflow:hidden;touch-action:none;}
svg{width:100%;height:100%;}
.prefecture{fill:white;stroke:#333;stroke-width:1;cursor:pointer;}
.prefecture.active{fill:red;}
button{margin:10px;padding:10px 20px;font-size:16px;}
</style>
</head>
<body>

<h1>あいかのにほんせいは</h1>
<div id="map-container"></div>
<button id="resetBtn">全て解除</button>

<script>
const container=document.getElementById("map-container");

function getSVGFile(){
  return window.innerWidth<=768?"map-mobile.svg":"map-full.svg";
}

let scale=1;
let translateX=0;
let translateY=0;
let startX,startY;
let isDragging=false;
let initialDistance=0;
let initialScale=1;

function loadMap(){

fetch(getSVGFile())
.then(res=>res.text())
.then(data=>{

container.innerHTML=data;
const svg=container.querySelector("svg");

const mapLayer=document.createElementNS("http://www.w3.org/2000/svg","g");
const labelLayer=document.createElementNS("http://www.w3.org/2000/svg","g");

while(svg.firstChild){
  mapLayer.appendChild(svg.firstChild);
}
svg.appendChild(mapLayer);
svg.appendChild(labelLayer);

const prefs=mapLayer.querySelectorAll(".prefecture");

// ===== ラベル生成 =====
prefs.forEach(pref=>{
  const title=pref.querySelector("title");
  if(!title) return;

  const name=title.textContent.split("/")[0].trim();
  const bbox=pref.getBBox();

  const text=document.createElementNS("http://www.w3.org/2000/svg","text");

  const cx=bbox.x+bbox.width/2;
  const cy=bbox.y+bbox.height/2;

  text.setAttribute("x",cx);
  text.setAttribute("y",cy);
  text.setAttribute("text-anchor","middle");
  text.setAttribute("dominant-baseline","middle");

  let fontSize=bbox.width/name.length*0.8;
  fontSize=Math.max(8,Math.min(fontSize,18));

  text.setAttribute("font-size",fontSize);
  text.setAttribute("fill","#000");
  text.setAttribute("stroke","#fff");
  text.setAttribute("stroke-width","3");
  text.setAttribute("paint-order","stroke");
  text.setAttribute("pointer-events","none");
  text.style.display="none";
  text.textContent=name;

  labelLayer.appendChild(text);
});

prefs.forEach(pref=>{
  pref.addEventListener("click",()=>{
    pref.classList.toggle("active");
  });
});

updateTransform();

// ===== タッチ開始 =====
container.addEventListener("touchstart",e=>{
  if(e.touches.length===2){
    initialDistance=getDistance(e.touches);
    initialScale=scale;
  }else if(e.touches.length===1){
    isDragging=true;
    startX=e.touches[0].clientX-translateX;
    startY=e.touches[0].clientY-translateY;
  }
});

// ===== タッチ移動 =====
container.addEventListener("touchmove",e=>{

  if(e.touches.length===2){
    e.preventDefault();

    const newDistance=getDistance(e.touches);
    let zoomRatio=newDistance/initialDistance;

    let newScale=initialScale*zoomRatio;
    newScale=Math.max(1,Math.min(newScale,5));

    const rect=container.getBoundingClientRect();
    const centerX=(e.touches[0].clientX+e.touches[1].clientX)/2-rect.left;
    const centerY=(e.touches[0].clientY+e.touches[1].clientY)/2-rect.top;

    translateX=centerX-(centerX-translateX)*(newScale/scale);
    translateY=centerY-(centerY-translateY)*(newScale/scale);

    scale=newScale;
    updateTransform();
  }

  else if(e.touches.length===1 && isDragging && scale>1){
    translateX=e.touches[0].clientX-startX;
    translateY=e.touches[0].clientY-startY;
    updateTransform();
  }
});

// ===== タッチ終了 =====
container.addEventListener("touchend",()=>{
  isDragging=false;
});

// ===== マウス =====
container.addEventListener("mousedown",e=>{
  if(scale<=1)return;
  isDragging=true;
  startX=e.clientX-translateX;
  startY=e.clientY-translateY;
});
container.addEventListener("mousemove",e=>{
  if(!isDragging)return;
  translateX=e.clientX-startX;
  translateY=e.clientY-startY;
  updateTransform();
});
container.addEventListener("mouseup",()=>{isDragging=false;});
container.addEventListener("mouseleave",()=>{isDragging=false;});

// ===== 変形処理 =====
function updateTransform(){
  const transform=`translate(${translateX},${translateY}) scale(${scale})`;
  mapLayer.setAttribute("transform",transform);
  labelLayer.setAttribute("transform",transform);

  labelLayer.querySelectorAll("text").forEach(t=>{
    t.style.display=scale>2?"block":"none";
  });
}

function getDistance(touches){
  const dx=touches[0].clientX-touches[1].clientX;
  const dy=touches[0].clientY-touches[1].clientY;
  return Math.sqrt(dx*dx+dy*dy);
}

});
}

loadMap();

window.addEventListener("resize",()=>{
container.innerHTML="";
scale=1;translateX=0;translateY=0;
loadMap();
});

document.getElementById("resetBtn").addEventListener("click",()=>{
document.querySelectorAll(".prefecture").forEach(p=>{
p.classList.remove("active");
});
});
</script>
</body>
</html>

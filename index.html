<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Japan Map</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
body {
  margin: 0;
  overflow: hidden;
}

.prefecture {
  fill: white;
  stroke: #333;
  stroke-width: 1;
  cursor: pointer;
}

.prefecture.selected {
  fill: red;
}

.label {
  font-size: 10px;
  text-anchor: middle;
  pointer-events: none;
}
</style>
</head>
<body>

<svg id="map"></svg>

<script>

const width = window.innerWidth;
const height = window.innerHeight;

const svg = d3.select("#map")
  .attr("width", width)
  .attr("height", height);

const g = svg.append("g");

const projection = d3.geoMercator()
  .center([137, 38])
  .scale(1800)
  .translate([width / 2, height / 2]);

const path = d3.geoPath().projection(projection);

svg.call(
  d3.zoom()
    .scaleExtent([1, 8])
    .on("zoom", (event) => {
      g.attr("transform", event.transform);
    })
);

d3.json("https://raw.githubusercontent.com/dataofjapan/land/master/japan.geojson")
  .then(function(data) {

    // 沖縄を最下部へ移動（そのまま）
    data.features.sort((a, b) => {
      if (a.properties.name === "Okinawa") return 1;
      if (b.properties.name === "Okinawa") return -1;
      return 0;
    });

    g.selectAll("path")
      .data(data.features)
      .enter()
      .append("path")
      .attr("class", "prefecture")
      .attr("d", path)
      .on("click", function(event, d) {
        d3.select(this).classed("selected",
          !d3.select(this).classed("selected"));
      });

    g.selectAll("text")
      .data(data.features)
      .enter()
      .append("text")
      .attr("class", "label")
      .attr("x", d => path.centroid(d)[0])
      .attr("y", d => {

        let y = path.centroid(d)[1];

        // 東京都・鹿児島だけ少し上にずらす
        if (d.properties.name === "Tokyo" ||
            d.properties.name === "Kagoshima") {

          y -= 10; // 上へ10pxだけ
        }

        return y;
      })
      .text(d => d.properties.name_ja || d.properties.name);

  });

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>47都道府県マップ</title>

<style>
body {
  margin: 0;
  font-family: sans-serif;
}

.container {
  display: flex;
  height: 100vh;
}

/* 左：地図 */
.map-area {
  flex: 1;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #f5f5f5;
}

/* 右：ボタン */
.list-area {
  width: 420px;
  overflow-y: auto;
  padding: 20px;
  border-left: 1px solid #ddd;
  background: #fff;
}

.pref-btn {
  width: 100%;
  padding: 8px;
  margin-bottom: 6px;
  border: 1px solid #ccc;
  background: #f8f8f8;
  cursor: pointer;
  text-align: left;
  transition: 0.2s;
}

.pref-btn.active {
  background: red;
  color: white;
}

svg {
  width: 95%;
  height: auto;
}

.prefecture {
  fill: #EEEEEE;
  stroke: #000;
  cursor: pointer;
  transition: 0.2s;
}

.prefecture:hover {
  fill: #ffaaaa;
}

.prefecture.active {
  fill: red !important;
}
</style>
</head>
<body>

<div class="container">
  <div class="map-area" id="map-container"></div>
  <div class="list-area" id="pref-list"></div>
</div>

<script>

// あなたのSVGに合わせたclass名一覧
const prefectures = [
"hokkaido","aomori","iwate","miyagi","akita","yamagata","fukushima",
"ibaraki","tochigi","gunma","saitama","chiba","tokyo","kanagawa",
"niigata","toyama","ishikawa","fukui","yamanashi","nagano",
"gifu","shizuoka","aichi","mie",
"shiga","kyoto","osaka","hyogo","nara","wakayama",
"tottori","shimane","okayama","hiroshima","yamaguchi",
"tokushima","kagawa","ehime","kochi",
"fukuoka","saga","nagasaki","kumamoto","oita","miyazaki","kagoshima",
"okinawa"
];

// SVG読み込み
fetch("map-mobile.svg")
  .then(res => res.text())
  .then(svg => {
    document.getElementById("map-container").innerHTML = svg;

    prefectures.forEach(pref => {
      const el = document.querySelector("g." + pref);
      if (el) {
        el.classList.add("prefecture");
        el.addEventListener("click", () => togglePref(pref));
      }
    });
  });

// 右側ボタン生成
const list = document.getElementById("pref-list");

prefectures.forEach(pref => {
  const btn = document.createElement("button");
  btn.className = "pref-btn";
  btn.dataset.pref = pref;
  btn.textContent = pref;
  btn.onclick = () => togglePref(pref);
  list.appendChild(btn);
});

// 連動処理
function togglePref(pref) {
  const mapEl = document.querySelector("g." + pref);
  const btnEl = document.querySelector(`[data-pref="${pref}"]`);

  if (!mapEl) return;

  mapEl.classList.toggle("active");
  btnEl.classList.toggle("active");
}

</script>

</body>
</html>
